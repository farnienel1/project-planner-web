[build]
  command = "npm run build"

[build.environment]
  # Builds and functions run on Node 22 (Next 16 supports it; @netlify/blobs 11 needs >= 22.12).
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  # These are public catalogue ids and the word "test", not credentials.
  # Netlify still scans them if "Contains secret values" is ticked, and "test"
  # matches the rest of the repo. Real secrets (STRIPE_SECRET_KEY,
  # STRIPE_WEBHOOK_SECRET) stay in the scan.
  SECRETS_SCAN_OMIT_KEYS = "STRIPE_MODE,STRIPE_PRICE_MONTHLY,STRIPE_PRICE_ANNUAL,STRIPE_PRODUCT_ID,STRIPE_PORTAL_CONFIGURATION_ID,STRIPE_TRIAL_REQUIRES_CARD,STRIPE_AUTOMATIC_TAX,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 302 (not 200 rewrite): the browser URL must become /auth/action or Next.js hydrates a 404.
[[redirects]]
  from = "/__/auth/action"
  to = "/auth/action"
  status = 302
  force = true

[[redirects]]
  from = "/__/auth/handler"
  to = "/auth/action"
  status = 302
  force = true

[[redirects]]
  from = "/__/auth/*"
  to = "/auth/action"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self), usb=()"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
