[build]
  command = "npm run build"

[build.environment]
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# PRs already get a Deploy Preview. Skip the extra branch-deploy so each pull
# does not spend a second Next.js build (~same credit cost again).
[context.branch-deploy]
  ignore = "exit 0"

# Skip preview builds that only touch docs, Cursor rules, markdown, or unit tests.
[context.deploy-preview]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs' ':!.cursor' ':!*.md' ':!**/*.test.ts' ':!**/*.test.tsx'"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self), usb=()"
    X-Permitted-Cross-Domain-Policies = "none"
