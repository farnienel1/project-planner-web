name: Web CI

# Typecheck, the full test suite and a production build on every pull request and on main.
# The rulebook workflow (rulebook.yml) keeps checking the packed script and the iOS mirror.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Tests must not depend on the runner's zone.
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `xlsx` installs from the cdn.sheetjs.com tarball named in package.json.
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: No second calculators outside lib/canonical
        # Own weekend cut-offs, browser / London business dates, single-id person matching (feature-completeness.md).
        run: npm run check:calculators
      - name: Security rules size and compile-cost budget
        # firestore.rules / storage.rules byte budget, and firestore.rules static compile cost (scripts/rules-cost/metric.py
        # total2, needs python3) in scripts/rules-budget.json (platform-guardrails.md §5, firestore-rules-notes.md "Compile cost").
        run: npm run check:rules-budget
      - name: Full test suite
        timeout-minutes: 10
        run: npm test
      - name: Production build
        # Placeholder public config so the build can prerender; no secrets, nothing is called. Only the build gets it:
        # with a Firebase config the test suite initialises Firestore and a test that writes (trackEvent) never exits.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

  rules-typecheck:
    # The console refuses rules its type checker reports as "Invalid type" (1.31.2). Same compiler as the emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Firestore rules type check (emulator)
        run: npx -y firebase-tools@15.34.2 emulators:exec --only firestore --project demo-rules-typecheck "node scripts/check-rules-typecheck.mjs"
